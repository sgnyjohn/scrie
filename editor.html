	<script>

		function _d() {
			if (arguments.length==1) {
				console.log(arguments[0]);

			}

		function searchStr(Str) {
			var eu = this;
			var va = {
				 'a' : 'áàâã'
				,'e' : 'éê'
				,'i' : 'í'
				,'o' : 'óôõ'
				,'u' : 'úü'
				,'c' : 'ç'
			};
			var vex = ',.,+,*,?,^,$,(,),[,],{,},\.,'; //aceita |,
			var vr,tx=''; //vrNot,
			init(Str);
			this.getStr = ()=>{return tx;};
			this.ajuda = (tit)=>{
				return (tit?tit+'\n\n':'')+'espaço - um E outro'
					+'\n| - um OU outro'
					+'\n- - negação'
					+'\n^ - prefixo palavra inteira'
					+'\n~ - prefixo para indical palavra iniciando em '
					+'\n_ - substitui espaços em literais'
				;		
			}
			//################################
			// se algum verdadeiro... OR
			function pesqUm(vEx,s) {
				for (let o=0;o<vEx.length;o++) {
					// [0] not? - [1] expr
					if ( vEx[o][0] != vEx[o][1].test(s) ) {
						return true;
					}
				}
				return false;				
			}
			//################################
			// se todos verdadeiros... AND
			this.pesq = function(s) {
				if (tx=='') return true;
				for (let e=0;e<vr.length;e++) {
					if (!pesqUm(vr[e],s)) {
						return false;
					}
				}
				return true;				
			}

			// palavra inteira ia /(^|\s)ia(\s|$)/
			function initUm(str) {
				var r = [false,false];
				str = str.trim();
				r[0] = str.charAt(0)=='-'; //negativo, não?
				if (r[0]) str = str.substring(1);
				if (str.charAt(0)=='~') {
					// prefixo palavra
					r[1] = new RegExp('([!-\/]|^|\\s)'+str.substring(1),'i');
				} else if (str.charAt(0)=='^') {
					//palavra
					r[1] = new RegExp('([!-\/:;]|^|\\s)'+str.substring(1)+'(\\s|$|[!-\/:;])','i');
				} else {
					r[1] = new RegExp(rExpr(str),'i');
				}
				return r;
			}
			function init(o) {
				var a = o?o.trim():'';
				// o ou é embutido dentro da expressao
				a = a.toLowerCase()
					.replaceAll('  ',' ')
					.replaceAll('| ','|')
					.replaceAll(' |','|')
				;
				//mudou?
				if (tx==a) {
					return false;
				}
				tx = a;
				var v = tx.split(' ');
				this.v = v;
				//if (referrer.search(new RegExp("Ral", "i")) == -1) { ...
				vr = Array();
				//vrNot = Array();
				for (let e=0;e<v.length;e++) {
					vr[e] = [];
					v[e].split('|').forEach((el)=>{
						vr[e].push(initUm(el));
					});
				}
				//lert('cond='+o+' '+vr);
				return true;
			}
			this.init = init;
			//###################################
			this.txt = function() {
				return tx;
			}
			//###################################
			this.valid = function() {
				var r=false;
				aeval(this.v,function(x) {if (x.length>2) r=true;});
				return r?NaN:"consulta inválida '"+a+"'";
			}
			//###################################
			function rExpr(t) {
				//expressão regular acentuação pt-br
				//áàâãéêíóôõúüñç
				//deb('==> ('+t+')');
				t = t.replaceAll('_',' ');
				var ca='',r = '';
				for (var i=0;i<t.length;i++) {
					var c = t.charAt(i);
					if (vex.indexOf(c)!=-1 && ca!='\\') {
						//deb('foi');
						r += '\\'+c;
					} else if ( va[c] ) {
						r += '['+c+va[c]+']';
					} else {
						r += c;
					}
					ca = c;
				}
				//eb(t+'==>('+r+') tm='+t.length);
				//dfsd=sdf;
				return r;
			}
		}

		function DB(doc) {

			//
  		function tds(col) {

			  var tt=0;

				alert('total sel '+ts+' de '+(mt.length));

						td.innerHTML = mt[rg][i];

				//_d('fim');
			}
			//
			function filtro() {
				if (rg>=mt.length) return false;
				for (k in fl) {
					if (!fl[k].pesq(mt[rg][k])) {
						return false;
					}
				}
				return true;
			}
			//
			function skip() {
				var r = false;
				rg++;
				while (!(r=filtro()) && rg<mt.length) {
					rg++;
				}
				return r;
			}
			//
			this.html = () => {

					dom = s;

					dom.addEventListener('click',clickTable);

			}
			//
			this.initCsv = (tx,Del)=>{

		// *************************** COLAR ********************************//

		editor.addEventListener('paste',async (ev)=>{
			//FILTROS disponíveis...
			// ideal ARRAY não OBJECT para PRIORIDADE no tipo em detrimento de outro
			const filtros = {
				//'application/whatsapp':(dat)=>{
				// txt com os ** para negrito, etc... 
				// 		manda junto text/plain
				//	console.log(dat);
				//}
				//,
				'text/html':(ht)=>{
					//ht = ht.replaceAll('://','...');

					function removeSrc(el) {
					}
					function removerTodosOsAtributos(ele) {

						}
						const attr = Array.from(ele.attributes);
						for (let i = 0; i < attr.length; i++) {

		function htmlTrim(html) {
			// Remove espaços e tabs entre tags, mantendo quebras de linha
			return html
				.replace(/>\s+</g, '>\n<')  // Substitui espaços/tabs entre tags por uma nova linha

		async function convertPngToJpg(pngBlob, quality = 0.85) {
			return new Promise((resolve, reject) => {
				// Criar imagem a partir do blob
				const img = new Image();
				const url = URL.createObjectURL(pngBlob);
				
				img.onload = function() {
					URL.revokeObjectURL(url);
					
					// Criar canvas
					const canvas = document.createElement('canvas');
					canvas.width = img.width;
					canvas.height = img.height;
					
					const ctx = canvas.getContext('2d');
					
					// Fundo branco para PNGs transparentes
					ctx.fillStyle = '#FFFFFF';
					ctx.fillRect(0, 0, canvas.width, canvas.height);
					
					// Desenhar imagem
					ctx.drawImage(img, 0, 0);
					
					// Converter para JPG
					canvas.toBlob(
						(blob) => {
								if (blob) {
										resolve(blob);
								} else {
										reject(new Error('Falha na conversão'));
								}
						},
						'image/jpeg',
						quality
					);
				};
				
				img.onerror = reject;
				img.src = url;
			});
		}

		function getSignificado(aRet,dom) {
			if (aRet.length>3) return;
			if (!dom) dom = editor;
			if ('h1 h2 h3 p li'.indexOf(dom.tagName.toLowerCase())!=-1
				&& dom.textContent.trim().replace(/^\s\n+|\s\n+$/g,'')!='') {
				aRet.push(dom)
			} else if (dom.childNodes) {
				for (var i=0;i<dom.childNodes.length;i++) {
					const el = dom.childNodes.item(i);
					getSignificado(aRet,el);
				}
			}
		}
		function htmlToImage(divElement) { //deepseek
			// Criar um canvas temporário
			const canvas = document.createElement('canvas');
			const ctx = canvas.getContext('2d');
			
			// Definir dimensões do canvas
			const rect = divElement.getBoundingClientRect();
			canvas.width = rect.width;
			canvas.height = rect.height;
			
			// Configurações do contexto
			ctx.fillStyle = window.getComputedStyle(divElement).backgroundColor || '#ffffff';
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			
			var aTex = [];
			getSignificado(aTex);
			for (var ei = 0;ei<aTex.length;ei++) {
				var el = aTex[ei];
				// Capturar estilos da div
				const styles = window.getComputedStyle(el);
				// Desenhar texto básico (limitado)
				ctx.fillStyle = styles.color || '#000000';
				ctx.font = styles.font || '16px Arial';
				ctx.textBaseline = 'top';
				// Adicionar texto simples
				ctx.fillText(el.textContent || el.innerText, 10+ei*15, 10);
			}
			
			// Retornar data URL
			return canvas.toDataURL('image/png');
		}
