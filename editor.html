		function htmlTrim(html) {
			// Remove espaços e tabs entre tags, mantendo quebras de linha
			return html
				.replace(/>\s+</g, '>\n<')  // Substitui espaços/tabs entre tags por uma nova linha
				.replace(/\n\s*\n/g, '\n')  // Remove linhas em branco extras
				.trim();
		}
	
		// 
		async function convertPngToJpg(pngBlob, quality = 0.85) {
			return new Promise((resolve, reject) => {
				// Criar imagem a partir do blob
				const img = new Image();
				const url = URL.createObjectURL(pngBlob);
				
				img.onload = function() {
					URL.revokeObjectURL(url);
					
					// Criar canvas
					const canvas = document.createElement('canvas');
					canvas.width = img.width;
					canvas.height = img.height;
					
					const ctx = canvas.getContext('2d');
					
					// Fundo branco para PNGs transparentes
					ctx.fillStyle = '#FFFFFF';
					ctx.fillRect(0, 0, canvas.width, canvas.height);
					
					// Desenhar imagem
					ctx.drawImage(img, 0, 0);
					
					// Converter para JPG
					canvas.toBlob(
						(blob) => {
								if (blob) {
										resolve(blob);
								} else {
										reject(new Error('Falha na conversão'));
								}
						},
						'image/jpeg',
						quality
					);
				};
				
				img.onerror = reject;
				img.src = url;
			});
		}

		function atualizarContadores() {
			const texto = editor.innerText || '';
			const caracteres = texto.length;
			const palavras = texto.trim() ? texto.trim().split(/\s+/).length : 0;
			
			charCount.textContent = `${caracteres} caracteres`;
			wordCount.textContent = `${palavras} palavras`;

			if ((p=content.indexOf(fim))!=-1)
				content = content.substring(0,p);
			editor.innerHTML = content;
		}

		//limpa tags sem child #text visivel

		function trimm(x) {
			const tb='\n\t ';
			while (x.length!=0 && tb.indexOf(x.charAt(0))!=-1) {
				x=x.substring(1);
			}
			while (x.length!=0 && tb.indexOf(x.charAt(x.length-1))!=-1) {
				x=x.substring(0,x.length-1);
			}
			return x;
		}

			if (!dom) dom = editor;
			if ('h1 h2 h3 p li'.indexOf(dom.tagName.toLowerCase())!=-1
				&& dom.textContent.trim().replace(/^\s\n+|\s\n+$/g,'')!='') {
				aRet.push(dom)
			} else if (dom.childNodes) {
				for (var i=0;i<dom.childNodes.length;i++) {
					const el = dom.childNodes.item(i);
					getSignificado(aRet,el);
				}
			}
		}
		function htmlToImage(divElement) { //deepseek
			// Criar um canvas temporário
			const canvas = document.createElement('canvas');
			const ctx = canvas.getContext('2d');
			
			// Definir dimensões do canvas
			const rect = divElement.getBoundingClientRect();
			canvas.width = rect.width;
			canvas.height = rect.height;
			
			// Configurações do contexto
			ctx.fillStyle = window.getComputedStyle(divElement).backgroundColor || '#ffffff';
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			
			var aTex = [];
			getSignificado(aTex);
			for (var ei = 0;ei<aTex.length;ei++) {
				var el = aTex[ei];
				// Capturar estilos da div
				const styles = window.getComputedStyle(el);
				// Desenhar texto básico (limitado)
				ctx.fillStyle = styles.color || '#000000';
				ctx.font = styles.font || '16px Arial';
				ctx.textBaseline = 'top';
				// Adicionar texto simples
				ctx.fillText(el.textContent || el.innerText, 10+ei*15, 10);
			}
			
			// Retornar data URL
			return canvas.toDataURL('image/png');
		}
			
			
		/////////////////////////////////////////////////////////////////
		function resizeContentDiv() {
			//lert('resize');
			const windowHeight = window.innerHeight;
			const cont = document.querySelector('#editor');//'div.container');
			const mtop = document.querySelector('div.toolbar').offsetHeight*1.06-23;
			const mbot = document.querySelector('div.status-bar').offsetHeight*1.05;
			cont.style.marginTop = mtop+'px'; //
			//cont.style.marginBottom = mbot+'px'; //
			cont.style.height = (windowHeight-mtop-mbot-40)+'px';
			//lert('css = '+cont.style.cssText);
			cont.focus();
		}
		document.addEventListener('DOMContentLoaded', resizeContentDiv);
		window.addEventListener('resize', resizeContentDiv);

		window.onbeforeunload = function() {
			return 'Tem certeza que deseja sair?';
		};			
		
	</script>
